[package]
name = "aicore"
version = "0.1.0"
edition = "2021"
description = "Platform-neutral core of the self-growing modular AI (registry, packages, runtime, router)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
ed25519-dalek = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
semver = "1"
anyhow = "1"
thiserror = "1"
tract-onnx = "0.21"
url = "2"
